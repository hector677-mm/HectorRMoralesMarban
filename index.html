<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Héctor Morales | Administrador de Infraestructura UNIX Senior &amp; Especialista Oracle</title>
  <meta name="description" content="Héctor Rafael Morales Marbán — Administrador de Infraestructura UNIX Senior con +15 años en entornos bancarios de alta criticidad. Especialista Oracle: Solaris, Exadata, Supercluster y OCI." />
  <meta name="author" content="Héctor Rafael Morales Marbán" />
  <meta property="og:type"        content="profile" />
  <meta property="og:title"       content="Héctor Morales | Infraestructura UNIX Senior &amp; Especialista Oracle" />
  <meta property="og:description" content="+15 años administrando servidores core en banca de alta criticidad. Especialista Oracle (Exadata, Supercluster, OCI)." />

  <!-- Seguridad: Content Security Policy
       - script-src 'self'          → solo scripts locales, sin inline ni CDN externos
       - style-src 'self' fonts 'unsafe-inline' → CSS local + Google Fonts + estilos inline necesarios (CSS variables)
       - font-src  → Google Fonts (gstatic)
       - img-src 'self' data:       → imágenes locales y data URIs
       - connect-src 'none'         → sin peticiones fetch/XHR
       - frame-ancestors 'none'     → previene clickjacking (equivale a X-Frame-Options: DENY)
       - object-src 'none'          → bloquea <object> y <embed>
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self';
                 style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
                 font-src 'self' https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'none';
                 frame-ancestors 'none';
                 object-src 'none';" />

  <!-- SEO: enlace canónico (actualiza con tu URL real de GitHub Pages) -->
  <link rel="canonical" href="https://hector677-mm.github.io/HectorRMoralesMarban/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body>

  <!-- Accesibilidad: enlace de salto para usuarios de teclado -->

  <!-- Fallback para navegadores sin JavaScript -->

      Esta página requiere JavaScript para funcionar. Por favor, actívalo en tu navegador.
    </div>

  <!-- ===== NAV (persistente, nunca se desmonta) ===== -->

      </a>

      <button class="nav__toggle" id="navToggle" aria-label="Menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav__menu" id="navMenu">
        <a href="#/"            data-route="/"            data-i18n="nav.home">Inicio</a>
        <a href="#/perfil"      data-route="/perfil"      data-i18n="nav.profile">Perfil</a>
        <a href="#/banca"       data-route="/banca"       data-i18n="nav.banking">Sector Bancario</a>

        <button class="lang-switch" id="langSwitch" aria-label="Cambiar idioma">
          <span class="lang-switch__opt is-active" data-lang="es">ES</span>
          <span class="lang-switch__sep">/</span>
          <span class="lang-switch__opt" data-lang="en">EN</span>
        </button>
      </nav>

    </div>
  </header>

  <!-- ===== PUNTO DE MONTAJE DE VISTAS (SPA) ===== -->
  <!-- tabindex="-1" permite recibir foco programático al cambiar de ruta (accesibilidad)  -->
  <!-- aria-live="polite" anuncia cambios de contenido a lectores de pantalla            -->
  <main id="app" tabindex="-1" aria-live="polite" aria-atomic="false"></main>

  <!-- ===== FOOTER (persistente, nunca se desmonta) ===== -->

      <span class="footer__copy">© <span id="year"></span> · Azcapotzalco, CDMX, México</span>
    </div>
  </footer>

  <!-- ===== SCRIPTS SPA (orden de carga obligatorio) =====
       1. i18n.js   → define window.I18N   (diccionario)
       2. views.js  → define window.Views  (plantillas HTML)
       3. router.js → define window.Router (enrutador hash)
       4. app.js    → arranca la aplicación
  -->
  <script src="js/i18n.js"></script>
  <script src="js/views.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
