<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body>

  <!-- ===== NAV (persistente, nunca se desmonta) ===== -->
  <header class="nav" id="nav">
    <div class="container nav__inner">

      <a href="#/" class="nav__brand" aria-label="Inicio">
        <span class="nav__monogram">HM</span>
        <span class="nav__brandtext">Héctor Morales</span>
      </a>

      <button class="nav__toggle" id="navToggle" aria-label="Menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav__menu" id="navMenu">
        <a href="#/"            data-route="/"            data-i18n="nav.home">Inicio</a>
        <a href="#/perfil"      data-route="/perfil"      data-i18n="nav.profile">Perfil</a>
        <a href="#/banca"       data-route="/banca"       data-i18n="nav.banking">Sector Bancario</a>
        <a href="#/experiencia" data-route="/experiencia" data-i18n="nav.experience">Experiencia</a>
        <a href="#/logros"      data-route="/logros"      data-i18n="nav.logros">Logros</a>
        <a href="#/sobre-mi"    data-route="/sobre-mi"    data-i18n="nav.gallery">Sobre mí</a>
        <a href="#/contacto"    data-route="/contacto"    class="nav__cta" data-i18n="nav.contact">Contacto</a>

        <button class="lang-switch" id="langSwitch" aria-label="Cambiar idioma">
          <span class="lang-switch__opt is-active" data-lang="es">ES</span>
          <span class="lang-switch__sep">/</span>
          <span class="lang-switch__opt" data-lang="en">EN</span>
        </button>
      </nav>

    </div>
  </header>

  <!-- ===== PUNTO DE MONTAJE DE VISTAS (SPA) ===== -->
  <!-- El Router inyecta aquí el HTML de cada vista al cambiar la ruta -->
  <main id="app"></main>

  <!-- ===== FOOTER (persistente, nunca se desmonta) ===== -->
  <footer class="footer">
    <div class="container footer__inner">
      <span class="footer__brand">Héctor Rafael Morales Marbán</span>
      <span class="footer__meta" data-i18n="footer.role">Administrador de Infraestructura UNIX Senior · Especialista Oracle</span>
      <span class="footer__copy">© <span id="year"></span> · Azcapotzalco, CDMX, México</span>
    </div>
  </footer>

  <!-- ===== SCRIPTS SPA (orden de carga obligatorio) =====
       1. i18n.js   → define window.I18N   (diccionario)
       2. views.js  → define window.Views  (plantillas HTML)
       3. router.js → define window.Router (enrutador hash)
       4. app.js    → arranca la aplicación
  -->
  <script src="js/i18n.js"></script>
  <script src="js/views.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
